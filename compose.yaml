services:
  mysql:
    image: mysql:8.4
    container_name: nexusdata-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexusdata_auth}
      MYSQL_USER: ${MYSQL_USER:-nexusdata_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cambia_esta_contrasena}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cambia_esta_contrasena_root}
    volumes:
      - nexusdata_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  nexusdata_mysql:
