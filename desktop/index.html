<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; frame-src 'self' data:;" />
    <title>NexusData</title>
    <style>
      html,
      body {
        background-color: #000;
      }
    </style>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="auth-screen" class="auth-screen" aria-hidden="true" hidden></div>
    <div class="app-shell app-hidden" aria-hidden="true">
      <aside id="sidebar" class="sidebar" aria-label="Panel lateral">
        <div class="sidebar-pane">
          <div class="sidebar-label">EXPLORER</div>
          <nav class="main-nav" aria-label="Navegación principal">
            <div class="sidebar-search-group">
              <div class="sidebar-search-row">
                <button id="sidebar-search-toggle" class="sidebar-search-toggle" type="button" aria-controls="sidebar-search-field" aria-expanded="false" aria-label="Mostrar búsqueda rápida" title="Mostrar búsqueda rápida"><svg class="sidebar-search-toggle-icon" viewBox="0 0 16 16" focusable="false" aria-hidden="true"><path d="m3.5 6 4.5 4.5L12.5 6"></path></svg></button>
                <button class="nav-item active" data-view="global-search"><span class="nav-icon">⌕</span>Buscar</button>
              </div>
              <div id="sidebar-search-field" class="sidebar-search-field" hidden>
                <div class="sidebar-search-input-wrap">
                  <span aria-hidden="true">⌕</span>
                  <input id="sidebar-search-input" class="sidebar-search-input" type="search" placeholder="Buscar documentos…" autocomplete="off" aria-label="Buscar documentos">
                </div>
              </div>
            </div>
            <button class="nav-item" data-view="recent-documents"><span class="nav-icon">◷</span>Documentos recientes</button>
            <button class="nav-item" data-view="favorites"><span class="nav-icon">★</span>Favoritos</button>
            <button class="nav-item" data-view="html-viewer"><span class="nav-icon">▣</span>Visor HTML</button>
            <button class="nav-item nav-item-sub" data-view="diagrams"><span class="nav-icon">◇</span>Diagramas</button>
            <button class="nav-item" data-view="code-map"><span class="nav-icon">⌘</span>Mapa de código</button>
            <button class="nav-item" data-view="sources"><span class="nav-icon">◈</span>Fuentes</button>
            <button class="nav-item" data-view="file-explorer"><span class="nav-icon">▤</span>Explorador de ficheros</button>
          </nav>
        </div>
      </aside>

      <main class="main-content">
        <div id="toast-region" class="toast-region" aria-live="polite"></div>
        <section id="view-global-search" class="view active"></section>
        <section id="view-search" class="view"></section>
        <section id="view-recent-documents" class="view"></section>
        <section id="view-favorites" class="view"></section>
        <section id="view-html-viewer" class="view"></section>
        <section id="view-diagrams" class="view"></section>
        <section id="view-code-map" class="view"></section>
        <section id="view-sources" class="view"></section>
        <section id="view-file-explorer" class="view"></section>
      </main>
    </div>

    <div id="modal-root"></div>
    <script src="js/markdown.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
